<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Back Card (Layered Tilt) -->
  <rect x="156" y="96" width="220" height="290" rx="28" fill="#93c5fd" opacity="0.6" transform="rotate(12 266 241)" />

  <!-- Main Flashcard -->
  <g filter="url(#shadow)">
    <rect x="126" y="116" width="260" height="280" rx="32" fill="url(#cardGrad)" />
    
    <!-- Accent Top Pill -->
    <rect x="166" y="156" width="60" height="12" rx="6" fill="#3b82f6" />
    
    <!-- Big Stylized 'Q' -->
    <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#1e3a8a" text-anchor="middle">Q</text>
    
    <!-- Bottom line indicators -->
    <rect x="166" y="336" width="180" height="10" rx="5" fill="#cbd5e1" />
  </g>

  <!-- Sparkle Accent -->
  <circle cx="396" cy="116" r="16" fill="#fbbf24" />
  <circle cx="116" cy="396" r="12" fill="#38bdf8" />
</svg>
